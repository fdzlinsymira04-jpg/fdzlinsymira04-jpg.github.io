<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungi Kami - Homestay Terengganu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">HOMESTAY TERENGGANU</div>
        <nav>
            <a href="index.html">Utama</a>
            <a href="rooms.html">Bilik</a>
            <a href="facilities.html">Kemudahan</a>
            <a href="gallery.html">Galeri</a>
            <a href="about.html">Tentang Kami</a>
            <a href="contact.html" class="active">Hubungi</a>
        </nav>
    </header>

    <section class="page-header">
        <h1>Hubungi & Tempahan</h1>
        <p>Sila hubungi kami untuk sebarang pertanyaan atau Tempahan</p>
    </section>

    <section class="container contact-container">
        <form class="contact-form">
            <label>Nama Penuh</label>
            <input type="text" placeholder="Masukkan nama anda" required>
            
            <label>Nombor Telefon</label>
            <input type="tel" placeholder="012-3456789" required>
            
            <label>Tarikh Masuk</label>
            <input type="date" required>
            
            <label>Mesej / Permintaan Khas</label>
            <textarea rows="4" placeholder="Tulis mesej anda di sini..."></textarea>
            
            <button type="submit" class="btn">Hantar Tempahan</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Homestay Terengganu Minimalist. Hak Cipta Terelihara.</p>
    </footer>
</body>
